<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drinks</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="row">
        <div class="col-sm-12">
            <table class="table table-hover table-dark table-striped">
            <thead>
                <th>NAME</th>
                <th>PRICE</th>
            </thead>
            <tbody id="table">

            </tbody>
        </table>
        </div>
    </div>

    <form id="form" onsubmit="return validate()" method="post">
            <div class="row">
            <div class="col">
                <input type="text" id="dname" name="dname" placeholder="Name" class="form-control" required>
                <span id="dnameMsg" class="msg"></span>
            </div>
            <div class="col">
                <input type="number" id="price" name="price" value="1" min="1" class="form-control" required>
                <span id="priceMsg" class="msg"></span>
            </div>
            <div class="col">
                <button type="submit" class="btn btn-primary">Add</button>
            </div>
        </div>
    </form>
    </div>

    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
<footer>

</footer>
</html>
